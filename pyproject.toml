[project]
name = "startup-template-python"
version = "0.0.1"
description = "python template for new projects"
authors = [{ name = "datataclouder", email = "adamo.figueroa@gmail.com" }]
requires-python = ">=3.12"

dependencies = [
    "fastapi[all]==0.110.1",
    "uvicorn[standard]>=0.29.0",
    "oauth2client>=4.1.3",
    "google-cloud-texttospeech>=2.24.0",
    "google-generativeai>=0.8.4",
    "python-dotenv>=1.0.1",
    "fal-client>=0.5.7",
    "pillow>=10.4.0",
    "pydantic-ai>=0.0.52",
    "pymongo>=4.10.1",
    "groq>=0.18.0",
    "pandas>=2.2.3",
    "google-cloud-storage>=3.1.0",
    "dataclouder-tts>=0.0.8",
    "dataclouder-core>=0.0.5",
    "dataclouder-agent-cards>=0.0.14",
    "dataclouder-conversation-ai-cards>=0.0.9",
    "dataclouder-mongo>=0.0.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.6", "ipykernel>=6.29.5"]

[tool.ruff]
line-length = 180
fix = true           # Enable auto-fixing
unsafe-fixes = false # Enable unsafe fixes

[tool.ruff.lint]
select = ['ALL']
ignore = [
    "TC004",
    "TC002",
    "E402",
    "T201",
    "D100",
    "D103",
    "PTH123",
    "INP001",
    "D415",
    "FBT001",
    "TRY003",
    "TRY002",
    "D101",
    "S311",
    "FBT002",
    "TD003",
    "D102",
    "FIX002",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.11.13"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
